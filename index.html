<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MamaZan">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F3D2B">
<meta name="format-detection" content="telephone=no">
<title>MamaZan – Caisse</title>
<style>
  :root{
    --green:#1F3D2B;
    --green-dark:#152a1e;
    --terracotta:#B23A2F;
    --terracotta-dark:#8f2e25;
    --cream:#FBF3E7;
    --line:#d8c9b0;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    position:fixed; inset:0; width:100%; height:100%;
    overflow:hidden;
    background:var(--cream);
    color:var(--green);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
  }

  button{ font-family:inherit; }
  input{ font-family:inherit; }

  #app{
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }

  header{
    flex:0 0 auto;
    background:var(--green);
    color:var(--cream);
    padding:14px 20px;
    display:flex; align-items:baseline; gap:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
    z-index:2;
  }
  header h1{ margin:0; font-size:1.5rem; letter-spacing:.5px; }
  header span{ font-size:1rem; opacity:.85; }

  #tabs{ margin-left:auto; display:flex; gap:10px; align-self:center; }
  .tab-btn{
    background:rgba(251,243,231,.12);
    color:var(--cream);
    border:2px solid rgba(251,243,231,.4);
    border-radius:10px;
    min-height:48px;
    padding:0 20px;
    font-size:1rem; font-weight:700;
    cursor:pointer;
    touch-action:manipulation;
  }
  .tab-btn.active{ background:var(--cream); color:var(--green); border-color:var(--cream); }

  main{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    gap:14px;
    padding:14px;
  }

  @media (max-width: 900px){
    main{ flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  }

  main.hidden{ display:none; }

  #view-fin{ justify-content:center; }
  #view-fin .col{ flex:0 1 640px; max-width:640px; }

  .col{
    display:flex; flex-direction:column;
    min-height:0;
    gap:14px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .col-left{ flex:1.3; }
  .col-right{ flex:1; }

  .panel{
    background:#fff8ee;
    border:2px solid var(--line);
    border-radius:16px;
    padding:14px;
    box-shadow:0 1px 4px rgba(31,61,43,.08);
    flex-shrink:0;
  }

  h2{
    margin:0 0 10px 0;
    font-size:1.1rem;
    color:var(--green);
    text-transform:uppercase;
    letter-spacing:.5px;
  }

  /* ---- Produits ---- */
  #products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  .product-btn{
    background:var(--green);
    color:var(--cream);
    border:none;
    border-radius:16px;
    min-height:100px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    font-weight:700;
    cursor:pointer;
    touch-action:manipulation;
  }
  .product-btn:active{ background:var(--green-dark); transform:scale(0.97); }
  .product-name{ font-size:1.25rem; }
  .product-price{ font-size:1.05rem; opacity:.9; }

  /* ---- Panier ---- */
  #cart-panel{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  #cart-lines{
    flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
    min-height:120px;
  }
  .empty-hint{ color:#8a7b63; font-size:1rem; padding:10px 2px; }

  .cart-line{
    display:flex; align-items:center; flex-wrap:wrap;
    gap:10px;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
  }
  .cart-line-name{ flex:1 1 140px; font-size:1.15rem; font-weight:700; }
  .cart-line-controls{ display:flex; align-items:center; gap:8px; }
  .qty-btn{
    border:2px solid var(--green);
    background:var(--cream);
    color:var(--green);
    border-radius:10px;
    min-width:52px; min-height:52px;
    font-size:1.15rem; font-weight:700;
    cursor:pointer;
    touch-action:manipulation;
  }
  .qty-btn:active{ background:var(--green); color:var(--cream); }
  .qty-btn.plus5{ border-color:var(--terracotta); color:var(--terracotta); }
  .qty-btn.plus5:active{ background:var(--terracotta); color:var(--cream); }

  .qty-input{
    width:64px; min-height:52px;
    text-align:center;
    font-size:1.2rem; font-weight:700;
    border:2px solid var(--green);
    border-radius:10px;
    background:#fff;
    color:var(--green);
  }
  .cart-line-subtotal{
    flex:0 0 90px; text-align:right;
    font-size:1.15rem; font-weight:700;
  }

  #cart-footer{
    flex:0 0 auto;
    padding-top:10px; margin-top:6px;
    border-top:2px solid var(--line);
  }
  .cart-total-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:1.4rem; font-weight:800;
    margin-bottom:10px;
  }
  #validate-btn{
    width:100%;
    background:var(--terracotta);
    color:var(--cream);
    border:none;
    border-radius:14px;
    min-height:76px;
    font-size:1.4rem; font-weight:800;
    cursor:pointer;
    touch-action:manipulation;
  }
  #validate-btn:active{ background:var(--terracotta-dark); }
  #validate-btn:disabled{ background:#c9b7a3; color:#fff; cursor:default; }

  #clear-cart-btn{
    display:block;
    margin:10px auto 0 auto;
    background:none;
    border:none;
    color:#8a7b63;
    font-size:.95rem;
    text-decoration:underline;
    padding:6px;
    cursor:pointer;
    touch-action:manipulation;
  }

  /* ---- Historique ---- */
  #history-panel{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  #history-list{
    flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
    min-height:100px;
  }
  .order-entry{ padding:10px 4px; border-bottom:1px solid var(--line); }
  .order-row{ display:flex; align-items:center; gap:10px; }
  .order-num{ font-weight:800; }
  .order-time{ color:#6b5e48; font-size:.95rem; }
  .order-total{ margin-left:auto; font-weight:800; }
  .order-detail{ font-size:.95rem; color:#4a4030; margin-top:2px; }
  .order-actions{ display:flex; align-items:center; gap:6px; }

  .mini-btn{
    border:2px solid var(--terracotta);
    background:var(--cream);
    color:var(--terracotta);
    border-radius:8px;
    min-width:40px; min-height:40px;
    font-size:1rem; font-weight:700;
    cursor:pointer;
    touch-action:manipulation;
  }
  .mini-btn:active{ background:var(--terracotta); color:var(--cream); }
  .confirm-yes{ border-color:var(--terracotta); background:var(--terracotta); color:var(--cream); }
  .confirm-no{ border-color:var(--green); color:var(--green); }
  .confirm-no:active{ background:var(--green); color:var(--cream); }
  .confirm-text{ font-size:.9rem; font-weight:700; color:var(--terracotta); }

  /* ---- Résumé ---- */
  #summary-panel{ background:var(--green); color:var(--cream); flex:0 0 auto; }
  #summary-panel h2{ color:var(--cream); }
  .summary-line{ display:flex; justify-content:space-between; font-size:1.05rem; padding:4px 0; }
  #summary-total-row{
    display:flex; justify-content:space-between;
    margin-top:8px; padding-top:8px; border-top:1px solid rgba(251,243,231,.35);
    font-size:1.3rem; font-weight:800;
  }

  /* ---- Sauvegarde GitHub ---- */
  #backup-panel{ flex:0 0 auto; }
  #backup-btn{
    width:100%;
    background:var(--green);
    color:var(--cream);
    border:none;
    border-radius:12px;
    min-height:64px;
    font-size:1.15rem; font-weight:800;
    cursor:pointer;
    touch-action:manipulation;
  }
  #backup-btn:active{ background:var(--green-dark); }
  #backup-btn:disabled{ background:#c9b7a3; cursor:default; }
  .backup-status{
    margin:10px 0 0 0;
    font-size:.95rem; font-weight:600;
    min-height:1.2em;
  }
  .backup-status.ok{ color:var(--green); }
  .backup-status.err{ color:var(--terracotta); }
  #backup-config-toggle{
    display:block;
    margin:8px auto 0 auto;
    background:none; border:none;
    color:#8a7b63;
    font-size:.9rem;
    text-decoration:underline;
    padding:6px;
    cursor:pointer;
    touch-action:manipulation;
  }
  #backup-config{ margin-top:10px; }
  #backup-config.hidden{ display:none; }
  #backup-config label{
    display:block;
    font-size:.9rem; font-weight:700;
    margin-bottom:8px;
  }
  #backup-config input{
    display:block;
    width:100%;
    margin-top:4px;
    min-height:48px;
    padding:0 10px;
    font-size:1rem;
    border:2px solid var(--green);
    border-radius:10px;
    background:#fff;
    color:var(--green);
    -webkit-user-select:text; user-select:text;
  }
  #cfg-save{
    width:100%;
    margin-top:4px;
    background:var(--green);
    color:var(--cream);
    border:none;
    border-radius:10px;
    min-height:52px;
    font-size:1rem; font-weight:800;
    cursor:pointer;
    touch-action:manipulation;
  }
  #cfg-save:active{ background:var(--green-dark); }

  /* ---- Reset ---- */
  #reset-panel{ flex:0 0 auto; }
  #reset-day-btn{
    width:100%;
    background:var(--cream);
    color:var(--terracotta);
    border:2px solid var(--terracotta);
    border-radius:12px;
    min-height:56px;
    font-size:1.05rem; font-weight:700;
    cursor:pointer;
    touch-action:manipulation;
  }
  #reset-day-btn:active{ background:var(--terracotta); color:var(--cream); }

  #reset-confirm{
    margin-top:10px;
    padding:12px;
    background:#fff0ec;
    border:2px solid var(--terracotta);
    border-radius:12px;
  }
  #reset-confirm.hidden{ display:none; }
  #reset-confirm p{ margin:0 0 10px 0; font-size:.95rem; color:var(--terracotta-dark); font-weight:600; }
  #reset-confirm-buttons{ display:flex; gap:10px; }
  #reset-confirm-buttons button{
    flex:1; min-height:52px; border-radius:10px; font-size:1rem; font-weight:800;
    cursor:pointer; touch-action:manipulation; border:2px solid var(--terracotta);
  }
  #reset-confirm-yes{ background:var(--terracotta); color:var(--cream); }
  #reset-confirm-yes:active{ background:var(--terracotta-dark); }
  #reset-confirm-no{ background:var(--cream); color:var(--terracotta); }
  #reset-confirm-no:active{ background:#f0dcd4; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>MamaZan</h1>
    <span>Caisse locale</span>
    <nav id="tabs">
      <button id="tab-caisse" class="tab-btn active">Caisse</button>
      <button id="tab-fin" class="tab-btn">Fin de journée</button>
    </nav>
  </header>

  <main id="view-caisse">
    <div class="col col-left">
      <div class="panel">
        <h2>Produits</h2>
        <div id="products"></div>
      </div>

      <div class="panel" id="cart-panel">
        <h2>Commande en cours</h2>
        <div id="cart-lines"></div>
        <div id="cart-footer">
          <div class="cart-total-row">
            <span>Total</span>
            <span id="cart-total">0,00 €</span>
          </div>
          <button id="validate-btn" disabled>Valider la commande</button>
          <button id="clear-cart-btn">Vider le panier</button>
        </div>
      </div>
    </div>

    <div class="col col-right">
      <div class="panel" id="history-panel">
        <h2>Commandes du jour</h2>
        <div id="history-list"></div>
      </div>

      <div class="panel" id="summary-panel">
        <h2>Résumé du jour</h2>
        <div id="summary-list"></div>
        <div id="summary-total-row">
          <span>Chiffre d'affaires</span>
          <span id="summary-total">0,00 €</span>
        </div>
      </div>

    </div>
  </main>

  <main id="view-fin" class="hidden">
    <div class="col">
      <div class="panel" id="backup-panel">
        <h2>Sauvegarde GitHub</h2>
        <button id="backup-btn">Sauvegarder sur GitHub</button>
        <p id="backup-status" class="backup-status"></p>
        <button id="backup-config-toggle">Réglages de la sauvegarde</button>
        <div id="backup-config" class="hidden">
          <label>Utilisateur GitHub
            <input id="cfg-owner" type="text" autocapitalize="none" autocorrect="off" autocomplete="off" placeholder="ex : youness123">
          </label>
          <label>Nom du dépôt (privé)
            <input id="cfg-repo" type="text" autocapitalize="none" autocorrect="off" autocomplete="off" placeholder="ex : mamazan-ventes">
          </label>
          <label>Jeton d'accès (token)
            <input id="cfg-token" type="password" autocapitalize="none" autocorrect="off" autocomplete="off" placeholder="github_pat_...">
          </label>
          <button id="cfg-save">Enregistrer les réglages</button>
        </div>
      </div>

      <div class="panel" id="reset-panel">
        <h2>Nouvelle journée</h2>
        <button id="reset-day-btn">Réinitialiser la journée</button>
        <div id="reset-confirm" class="hidden">
          <p>Es-tu sûr ? Toutes les commandes du jour seront supprimées définitivement.</p>
          <div id="reset-confirm-buttons">
            <button id="reset-confirm-no">Annuler</button>
            <button id="reset-confirm-yes">Oui, tout effacer</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  var PRODUCTS = [
    { id:'rotinature',   name:'Rôti nature',   price:1.00 },
    { id:'roti',         name:'Rôti',          price:1.40 },
    { id:'rotiglenryck', name:'Rôti Glenryck', price:1.70 },
    { id:'samoussa',     name:'Samoussa',      price:0.80 },
    { id:'nems',         name:'Nems',          price:0.80 },
    { id:'puddingmais',  name:'Pudding maïs',  price:1.20 },
    { id:'citronnade',   name:'Citronnade',    price:1.00 },
    { id:'tamarin',      name:'Jus tamarin',   price:1.00 },
    { id:'gatopima',     name:'Gato Pima',     price:0.60 }
  ];

  var STORAGE_KEY = 'mamazan_caisse_v1';

  var state = loadState();
  var pendingDelete = null;

  function loadState(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && typeof parsed === 'object'){
          if(!Array.isArray(parsed.orders)) parsed.orders = [];
          if(typeof parsed.nextOrderNumber !== 'number') parsed.nextOrderNumber = 1;
          if(!parsed.cart || typeof parsed.cart !== 'object') parsed.cart = {};
          return parsed;
        }
      }
    } catch(e){}
    return { orders: [], nextOrderNumber: 1, cart: {} };
  }

  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ /* stockage indisponible : la session continue en mémoire */ }
  }

  function formatEuro(n){
    return n.toFixed(2).replace('.', ',') + ' €';
  }

  function findProduct(id){
    for(var i=0;i<PRODUCTS.length;i++){ if(PRODUCTS[i].id===id) return PRODUCTS[i]; }
    return null;
  }

  // ---------- Eléments DOM ----------
  var productsEl     = document.getElementById('products');
  var cartLinesEl     = document.getElementById('cart-lines');
  var cartTotalEl     = document.getElementById('cart-total');
  var validateBtn     = document.getElementById('validate-btn');
  var clearCartBtn    = document.getElementById('clear-cart-btn');
  var historyEl       = document.getElementById('history-list');
  var summaryListEl   = document.getElementById('summary-list');
  var summaryTotalEl  = document.getElementById('summary-total');
  var resetDayBtn     = document.getElementById('reset-day-btn');
  var resetConfirmEl  = document.getElementById('reset-confirm');
  var resetYesBtn     = document.getElementById('reset-confirm-yes');
  var resetNoBtn      = document.getElementById('reset-confirm-no');

  // ---------- Rendu ----------
  function renderProducts(){
    productsEl.innerHTML = PRODUCTS.map(function(p){
      return '<button class="product-btn" data-product="'+p.id+'">' +
        '<span class="product-name">'+p.name+'</span>' +
        '<span class="product-price">'+formatEuro(p.price)+'</span>' +
        '</button>';
    }).join('');
  }

  function calcCartTotal(){
    var total = 0;
    Object.keys(state.cart).forEach(function(id){
      var p = findProduct(id);
      if(p) total += p.price * state.cart[id];
    });
    return total;
  }

  function renderCart(){
    var ids = Object.keys(state.cart).filter(function(id){ return state.cart[id] > 0; });

    if(ids.length === 0){
      cartLinesEl.innerHTML = '<p class="empty-hint">Touchez un produit ci-dessus pour commencer une commande.</p>';
    } else {
      cartLinesEl.innerHTML = ids.map(function(id){
        var p = findProduct(id);
        var qty = state.cart[id];
        var subtotal = p.price * qty;
        return '<div class="cart-line">' +
          '<div class="cart-line-name">'+p.name+'</div>' +
          '<div class="cart-line-controls">' +
            '<button class="qty-btn minus" data-action="minus1" data-id="'+id+'">−1</button>' +
            '<input class="qty-input" type="text" inputmode="numeric" pattern="[0-9]*" data-id="'+id+'" value="'+qty+'">' +
            '<button class="qty-btn plus" data-action="plus1" data-id="'+id+'">+1</button>' +
            '<button class="qty-btn plus5" data-action="plus5" data-id="'+id+'">+5</button>' +
          '</div>' +
          '<div class="cart-line-subtotal">'+formatEuro(subtotal)+'</div>' +
        '</div>';
      }).join('');
    }

    cartTotalEl.textContent = formatEuro(calcCartTotal());
    validateBtn.disabled = ids.length === 0;
  }

  function renderHistory(){
    if(state.orders.length === 0){
      historyEl.innerHTML = '<p class="empty-hint">Aucune commande enregistrée pour l\'instant.</p>';
      return;
    }
    historyEl.innerHTML = state.orders.map(function(order){
      var detail = order.items.map(function(it){ return it.qty+'× '+it.name; }).join(', ');
      var isPending = pendingDelete === order.number;
      var actionsHtml;
      if(isPending){
        actionsHtml = '<span class="confirm-text">Supprimer ?</span>' +
          '<button class="mini-btn confirm-yes" data-action="confirm-delete" data-number="'+order.number+'">Oui</button>' +
          '<button class="mini-btn confirm-no" data-action="cancel-delete" data-number="'+order.number+'">Non</button>';
      } else {
        actionsHtml = '<button class="mini-btn delete-btn" data-action="ask-delete" data-number="'+order.number+'">✕</button>';
      }
      return '<div class="order-entry">' +
        '<div class="order-row">' +
          '<span class="order-num">#'+order.number+'</span>' +
          '<span class="order-time">'+order.time+'</span>' +
          '<span class="order-total">'+formatEuro(order.total)+'</span>' +
          '<span class="order-actions">'+actionsHtml+'</span>' +
        '</div>' +
        '<div class="order-detail">'+detail+'</div>' +
      '</div>';
    }).join('');
  }

  function renderSummary(){
    var qtyByProduct = {};
    PRODUCTS.forEach(function(p){ qtyByProduct[p.id] = 0; });
    var totalRevenue = 0;

    state.orders.forEach(function(order){
      totalRevenue += order.total;
      order.items.forEach(function(it){
        qtyByProduct[it.id] = (qtyByProduct[it.id] || 0) + it.qty;
      });
    });

    summaryListEl.innerHTML = PRODUCTS.map(function(p){
      var qty = qtyByProduct[p.id];
      return '<div class="summary-line"><span>'+p.name+'</span><span>'+qty+' vendu'+(qty>1?'s':'')+'</span></div>';
    }).join('');

    summaryTotalEl.textContent = formatEuro(totalRevenue);
  }

  function renderAll(){
    renderCart();
    renderHistory();
    renderSummary();
  }

  // ---------- Actions panier ----------
  function changeQty(id, delta){
    var current = state.cart[id] || 0;
    var next = Math.max(0, current + delta);
    if(next === 0) delete state.cart[id];
    else state.cart[id] = next;
    saveState();
    renderCart();
  }

  function setQty(id, value){
    var v = Math.max(0, Math.floor(value) || 0);
    if(v === 0) delete state.cart[id];
    else state.cart[id] = v;
    saveState();
    renderCart();
  }

  function validateOrder(){
    var ids = Object.keys(state.cart).filter(function(id){ return state.cart[id] > 0; });
    if(ids.length === 0) return;

    var items = ids.map(function(id){
      var p = findProduct(id);
      return { id:id, name:p.name, price:p.price, qty:state.cart[id] };
    });
    var total = items.reduce(function(sum, it){ return sum + it.price*it.qty; }, 0);

    var order = {
      number: state.nextOrderNumber++,
      time: new Date().toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }),
      items: items,
      total: total
    };

    state.orders.unshift(order);
    state.cart = {};
    saveState();
    renderAll();
  }

  function deleteOrder(number){
    state.orders = state.orders.filter(function(o){ return o.number !== number; });
    saveState();
  }

  function resetDay(){
    state = { orders: [], nextOrderNumber: 1, cart: {} };
    pendingDelete = null;
    saveState();
    renderAll();
    hideResetConfirm();
  }

  function showResetConfirm(){ resetConfirmEl.classList.remove('hidden'); }
  function hideResetConfirm(){ resetConfirmEl.classList.add('hidden'); }

  // ---------- Ecouteurs ----------
  productsEl.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-product]');
    if(!btn) return;
    var id = btn.dataset.product;
    var current = state.cart[id] || 0;
    state.cart[id] = current + 1;
    saveState();
    renderCart();
  });

  cartLinesEl.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-action]');
    if(!btn) return;
    var id = btn.dataset.id;
    var action = btn.dataset.action;
    if(action === 'minus1') changeQty(id, -1);
    else if(action === 'plus1') changeQty(id, 1);
    else if(action === 'plus5') changeQty(id, 5);
  });

  cartLinesEl.addEventListener('change', function(e){
    if(e.target.matches('input.qty-input')){
      var id = e.target.dataset.id;
      var v = parseInt(e.target.value, 10);
      if(isNaN(v) || v < 0) v = 0;
      setQty(id, v);
    }
  });

  cartLinesEl.addEventListener('focusin', function(e){
    if(e.target.matches('input.qty-input')){
      e.target.select();
    }
  });

  cartLinesEl.addEventListener('keydown', function(e){
    if(e.target.matches('input.qty-input') && e.key === 'Enter'){
      e.target.blur();
    }
  });

  validateBtn.addEventListener('click', validateOrder);

  clearCartBtn.addEventListener('click', function(){
    state.cart = {};
    saveState();
    renderCart();
  });

  historyEl.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-action]');
    if(!btn) return;
    var num = parseInt(btn.dataset.number, 10);
    var action = btn.dataset.action;
    if(action === 'ask-delete'){
      pendingDelete = num;
      renderHistory();
    } else if(action === 'confirm-delete'){
      deleteOrder(num);
      pendingDelete = null;
      renderHistory();
      renderSummary();
    } else if(action === 'cancel-delete'){
      pendingDelete = null;
      renderHistory();
    }
  });

  resetDayBtn.addEventListener('click', showResetConfirm);
  resetNoBtn.addEventListener('click', hideResetConfirm);
  resetYesBtn.addEventListener('click', resetDay);

  // ---------- Onglets ----------
  var viewCaisse = document.getElementById('view-caisse');
  var viewFin    = document.getElementById('view-fin');
  var tabCaisse  = document.getElementById('tab-caisse');
  var tabFin     = document.getElementById('tab-fin');

  function showView(name){
    var caisse = (name === 'caisse');
    viewCaisse.classList.toggle('hidden', !caisse);
    viewFin.classList.toggle('hidden', caisse);
    tabCaisse.classList.toggle('active', caisse);
    tabFin.classList.toggle('active', !caisse);
    hideResetConfirm();
  }

  tabCaisse.addEventListener('click', function(){ showView('caisse'); });
  tabFin.addEventListener('click', function(){ showView('fin'); });

  // ---------- Sauvegarde GitHub ----------
  var CFG_KEY = 'mamazan_github_cfg_v1';

  var backupBtn       = document.getElementById('backup-btn');
  var backupStatusEl  = document.getElementById('backup-status');
  var backupToggleBtn = document.getElementById('backup-config-toggle');
  var backupConfigEl  = document.getElementById('backup-config');
  var cfgOwnerEl      = document.getElementById('cfg-owner');
  var cfgRepoEl       = document.getElementById('cfg-repo');
  var cfgTokenEl      = document.getElementById('cfg-token');
  var cfgSaveBtn      = document.getElementById('cfg-save');

  function loadCfg(){
    try {
      var raw = localStorage.getItem(CFG_KEY);
      if(raw) return JSON.parse(raw);
    } catch(e){}
    return null;
  }

  function setBackupStatus(msg, kind){
    backupStatusEl.textContent = msg;
    backupStatusEl.className = 'backup-status' + (kind ? ' ' + kind : '');
  }

  function todayStamp(){
    var d = new Date();
    var m = String(d.getMonth()+1); if(m.length<2) m='0'+m;
    var j = String(d.getDate());   if(j.length<2) j='0'+j;
    return d.getFullYear()+'-'+m+'-'+j;
  }

  function buildBackupContent(){
    var d = new Date();
    var lines = [];
    lines.push('# MamaZan — Journée du ' + d.toLocaleDateString('fr-FR'));
    lines.push('');
    lines.push('Sauvegardé à ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) + '.');
    lines.push('');
    lines.push('## Commandes');
    lines.push('');
    if(state.orders.length === 0){
      lines.push('Aucune commande.');
    } else {
      lines.push('| N° | Heure | Détail | Total |');
      lines.push('|----|-------|--------|-------|');
      // les commandes sont stockées de la plus récente à la plus ancienne ; on les liste dans l'ordre de la journée
      for(var i = state.orders.length - 1; i >= 0; i--){
        var o = state.orders[i];
        var detail = o.items.map(function(it){ return it.qty+'× '+it.name; }).join(', ');
        lines.push('| '+o.number+' | '+o.time+' | '+detail+' | '+formatEuro(o.total)+' |');
      }
    }
    lines.push('');
    lines.push('## Résumé du jour');
    lines.push('');
    var qtyByProduct = {};
    var revenue = 0;
    PRODUCTS.forEach(function(p){ qtyByProduct[p.id] = 0; });
    state.orders.forEach(function(o){
      revenue += o.total;
      o.items.forEach(function(it){ qtyByProduct[it.id] = (qtyByProduct[it.id]||0) + it.qty; });
    });
    PRODUCTS.forEach(function(p){
      lines.push('- '+p.name+' : '+qtyByProduct[p.id]+' vendu'+(qtyByProduct[p.id]>1?'s':''));
    });
    lines.push('');
    lines.push('**Chiffre d\'affaires : '+formatEuro(revenue)+'**');
    lines.push('');
    return lines.join('\n');
  }

  function b64EncodeUtf8(str){
    return btoa(unescape(encodeURIComponent(str)));
  }

  function githubBackup(){
    var cfg = loadCfg();
    if(!cfg || !cfg.owner || !cfg.repo || !cfg.token){
      setBackupStatus('Réglages manquants : appuyez sur « Réglages de la sauvegarde » ci-dessous.', 'err');
      backupConfigEl.classList.remove('hidden');
      return;
    }

    var path = 'sauvegardes/' + todayStamp() + '.md';
    var apiUrl = 'https://api.github.com/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) + '/contents/' + path;
    var headers = {
      'Authorization': 'Bearer ' + cfg.token,
      'Accept': 'application/vnd.github+json'
    };

    backupBtn.disabled = true;
    setBackupStatus('Sauvegarde en cours…', '');

    // 1) le fichier du jour existe-t-il déjà ? (nécessaire pour le mettre à jour)
    fetch(apiUrl, { headers: headers })
      .then(function(res){
        if(res.status === 200) return res.json().then(function(j){ return j.sha; });
        if(res.status === 404) return null;
        if(res.status === 401) throw new Error('Jeton invalide ou expiré. Vérifiez les réglages.');
        throw new Error('Erreur GitHub (' + res.status + '). Vérifiez les réglages.');
      })
      .then(function(sha){
        var body = {
          message: 'Sauvegarde MamaZan du ' + todayStamp(),
          content: b64EncodeUtf8(buildBackupContent())
        };
        if(sha) body.sha = sha;
        return fetch(apiUrl, {
          method: 'PUT',
          headers: headers,
          body: JSON.stringify(body)
        });
      })
      .then(function(res){
        if(res.status === 200 || res.status === 201){
          var now = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
          setBackupStatus('✓ Sauvegardé sur GitHub à ' + now + '.', 'ok');
        } else if(res.status === 404){
          throw new Error('Dépôt introuvable. Vérifiez utilisateur et nom du dépôt.');
        } else if(res.status === 401 || res.status === 403){
          throw new Error('Accès refusé. Vérifiez le jeton et ses permissions.');
        } else {
          throw new Error('Erreur GitHub (' + res.status + ').');
        }
      })
      .catch(function(err){
        var msg = (err && err.message) ? err.message : '';
        if(!msg || /fetch|network|load/i.test(msg)){
          msg = 'Pas de connexion internet. Réessayez avec le Wi-Fi.';
        }
        setBackupStatus(msg, 'err');
      })
      .then(function(){
        backupBtn.disabled = false;
      });
  }

  backupBtn.addEventListener('click', githubBackup);

  backupToggleBtn.addEventListener('click', function(){
    backupConfigEl.classList.toggle('hidden');
    var cfg = loadCfg();
    if(cfg){
      cfgOwnerEl.value = cfg.owner || '';
      cfgRepoEl.value = cfg.repo || '';
      cfgTokenEl.value = cfg.token || '';
    }
  });

  cfgSaveBtn.addEventListener('click', function(){
    var cfg = {
      owner: cfgOwnerEl.value.trim(),
      repo: cfgRepoEl.value.trim(),
      token: cfgTokenEl.value.trim()
    };
    if(!cfg.owner || !cfg.repo || !cfg.token){
      setBackupStatus('Remplissez les trois champs avant d\'enregistrer.', 'err');
      return;
    }
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch(e){}
    backupConfigEl.classList.add('hidden');
    setBackupStatus('Réglages enregistrés.', 'ok');
  });

  // Nécessaire pour que :active se déclenche de façon fiable sur iOS Safari
  document.addEventListener('touchstart', function(){}, false);

  // ---------- Démarrage ----------
  renderProducts();
  renderAll();

  // ---------- Mise en cache hors-ligne ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
